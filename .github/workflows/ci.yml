name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thrustwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d thrustwise_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio httpx
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/thrustwise_test
          REDIS_URL: redis://localhost:6379/0
          EODHD_API_TOKEN: test_token_ci
          ENVIRONMENT: test
        run: pytest tests/ -v --tb=short

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thrustwise_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d thrustwise_migrate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/thrustwise_migrate
          REDIS_URL: redis://localhost:6379/0
          EODHD_API_TOKEN: test_token_ci
          ENVIRONMENT: test
        run: alembic upgrade head

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t thrustwise-backend:ci .
      - name: Verify .env not in image
        run: |
          docker run --rm thrustwise-backend:ci ls -la /app/ | grep -v ".env" || true
          # Fail if .env exists in the image
          if docker run --rm thrustwise-backend:ci test -f /app/.env; then
            echo "ERROR: .env found in Docker image!"
            exit 1
          fi
